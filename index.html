<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#090712" />
  <meta name="description" content="성공과 실패로 진행하는 EXP 투자 시뮬레이션 게임" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237126ff'/%3E%3Cstop offset='.55' stop-color='%23ff009d'/%3E%3Cstop offset='1' stop-color='%2300d9ff'/%3E%3C/linearGradient%3E%3Cfilter id='b'%3E%3CfeGaussianBlur stdDeviation='2'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%23080612'/%3E%3Crect x='4' y='4' width='56' height='56' rx='15' fill='url(%23g)' filter='url(%23b)' opacity='.9'/%3E%3Crect x='8' y='8' width='48' height='48' rx='13' fill='url(%23g)'/%3E%3Ctext x='32' y='38' text-anchor='middle' font-family='Arial' font-size='18' font-weight='900' fill='white'%3EeXP%3C/text%3E%3C/svg%3E" />

  <title>EXP Stock Game</title>

  <!-- Supabase JS SDK 불러오기 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050505;
      --card: rgba(22, 20, 32, 0.82);
      --white: #ffffff;
      --muted: #9995aa;

      --pink: #ff009d;
      --purple: #7d36ff;
      --blue: #11aaff;
      --green: #22ff8b;
      --red: #ff3260;
      --yellow: #fff000;

      --radius: 28px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--white);
      font-family: Inter, Pretendard, "Noto Sans KR", Arial, sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(92, 22, 255, 0.35), transparent 25%),
        radial-gradient(circle at 92% 15%, rgba(255, 0, 143, 0.24), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(0, 99, 255, 0.2), transparent 35%),
        var(--bg);
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.95), transparent 17%),
        linear-gradient(135deg, #762aff, #ff009d 60%, #00ccff);
      box-shadow: 0 0 24px rgba(255, 0, 157, 0.47), inset 0 0 20px rgba(255, 255, 255, 0.22);
    }

    .brand h1 { margin: 0; font-size: clamp(21px, 4vw, 30px); letter-spacing: -1px; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .status {
      color: #d7d4e3;
      font-size: 13px;
      line-height: 1.65;
      text-align: right;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.035));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
    }

    .settings {
      position: sticky;
      top: 20px;
      padding: 22px;
    }

    .card-title {
      margin: 0 0 18px;
      color: #f4efff;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #d8d3e6;
      font-size: 13px;
    }

    .field label span:last-child {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .field input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 15px;
      outline: none;
      color: white;
      background: rgba(0, 0, 0, 0.42);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255, 0, 157, 0.14);
    }

    .primary-btn {
      width: 100%;
      min-height: 51px;
      margin-top: 6px;
      border-radius: 16px;
      color: white;
      font-weight: 900;
      background: linear-gradient(110deg, #622cff, #e9009c 55%, #ff578f);
      box-shadow: 0 9px 24px rgba(218, 0, 157, 0.28);
      transition: transform 0.2s, filter 0.2s;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.14);
    }

    .game { min-width: 0; }

    .hero {
      position: relative;
      min-height: 250px;
      overflow: hidden;
      padding: 26px;
      margin-bottom: 22px;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 14% 20%, rgba(255, 0, 161, 0.86), transparent 25%),
        radial-gradient(circle at 88% 35%, rgba(77, 0, 255, 0.76), transparent 29%),
        linear-gradient(135deg, #0f0328, #120a2d 52%, #061d3a);
      box-shadow: 0 0 55px rgba(87, 19, 255, 0.25), inset 0 0 45px rgba(255, 255, 255, 0.06);
    }

    .hero::before, .hero::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      filter: blur(35px);
      opacity: 0.45;
      pointer-events: none;
    }

    .hero::before { top: -120px; right: 16%; background: #ff009d; }
    .hero::after { bottom: -130px; left: 22%; background: #00b7ff; }

    .hero-content { position: relative; z-index: 1; }

    .eyebrow {
      margin-bottom: 18px;
      color: #f0caff;
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 0, 190, 0.7), 0 0 28px rgba(102, 0, 255, 0.45);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .stat {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.25);
      color: #cbc5dd;
      font-size: 11px;
      line-height: 1.55;
    }

    .stat-label { display: block; margin-bottom: 4px; color: #bdb7d0; }
    .stat strong { display: block; overflow: hidden; color: white; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .stat strong.highlight { color: var(--yellow); text-shadow: 0 0 12px rgba(255, 240, 0, 0.65); }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .action-btn {
      min-height: 72px;
      padding: 13px 18px;
      border-radius: 20px;
      color: white;
      text-align: left;
      transition: transform 0.2s, filter 0.2s;
    }

    .action-btn:hover { transform: translateY(-3px); filter: brightness(1.12); }
    .action-btn:active { transform: translateY(0) scale(0.98); }

    .action-btn .action-label { display: block; margin-bottom: 4px; font-size: 18px; font-weight: 900; }
    .action-btn small { color: rgba(255, 255, 255, 0.72); font-size: 11px; }

    .success {
      background: radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.3), transparent 25%), linear-gradient(130deg, #034fcb, #01a6ff 52%, #16e29a);
      box-shadow: 0 8px 30px rgba(0, 160, 255, 0.23);
    }

    .failure {
      background: radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.25), transparent 25%), linear-gradient(130deg, #ff194d, #a30066 55%, #4415a7);
      box-shadow: 0 8px 30px rgba(242, 0, 90, 0.22);
    }

    .progress-card { padding: 20px; margin-bottom: 22px; }
    .progress-head { display: flex; align-items: end; justify-content: space-between; gap: 15px; margin-bottom: 14px; }
    .progress-head h3 { margin: 0; font-size: 15px; }
    .progress-number { color: #d6b8ff; font-size: 13px; }

    .progress-track { height: 12px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, 0.09); }
    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #622bff, #ff009d 55%, #ff77bc);
      box-shadow: 0 0 20px rgba(255, 0, 157, 0.7);
      transition: width 0.35s ease;
    }

    .list-card { padding: 24px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 4px 17px; }
    .list-header h3 { margin: 0; font-size: 16px; }
    .list-header span { color: var(--muted); font-size: 12px; text-align: right; }

    .round-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      max-height: 680px;
      overflow-y: auto;
      padding: 5px 6px 8px;
    }

    .round-list::-webkit-scrollbar { width: 7px; }
    .round-list::-webkit-scrollbar-thumb { border-radius: 20px; background: rgba(255, 255, 255, 0.2); }

    .round-item {
      position: relative;
      min-height: 116px;
      overflow: hidden;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.26);
      opacity: 0.48;
      transition: transform 0.3s, opacity 0.3s, border-color 0.3s, background 0.3s, box-shadow 0.3s;
    }

    .round-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(130deg, rgba(255, 239, 0, 0.34), transparent 58%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .round-item.reached {
      opacity: 1;
      border-color: rgba(255, 239, 0, 0.8);
      background: linear-gradient(145deg, rgba(255, 240, 0, 0.24), rgba(255, 140, 0, 0.12));
      box-shadow: 0 0 22px rgba(255, 230, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .round-item.reached::before { opacity: 1; }

    .round-item.current {
      transform: translateY(-3px);
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18), 0 0 28px rgba(255, 230, 0, 0.48);
    }

    .round-top, .round-value, .round-profit { position: relative; z-index: 1; }

    .round-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: #e7d8ff;
      font-size: 12px;
      font-weight: 800;
    }

    .round-top em { color: #8bffcd; font-size: 10px; font-style: normal; }
    .round-item.reached .round-top em { color: var(--yellow); }

    .round-value { margin-bottom: 6px; color: white; font-size: 15px; font-weight: 900; letter-spacing: -0.5px; }
    .round-profit { color: #bdb7cc; font-size: 11px; line-height: 1.45; }
    .round-item.reached .round-profit { color: #fff89a; }

    .empty { grid-column: 1 / -1; padding: 35px 20px; color: var(--muted); text-align: center; font-size: 13px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      padding: 13px 17px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: white;
      font-size: 13px;
      background: rgba(20, 10, 40, 0.9);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      transform: translate(-50%, 130px);
      transition: transform 0.3s ease;
      backdrop-filter: blur(15px);
    }

    .toast.show { transform: translate(-50%, 0); }

    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .settings { position: static; } }
    @media (max-width: 820px) {
      .app { width: min(100% - 22px, 620px); padding-top: 20px; }
      .topbar { align-items: flex-start; }
      .status { display: none; }
      .hero { min-height: 220px; }
      .round-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .hero-stats { grid-template-columns: 1fr; }
      .stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .stat-label { margin: 0; }
      .stat strong { text-align: right; }
    }
    @media (max-width: 430px) {
      .app { width: min(100% - 16px, 620px); }
      .brand-mark { width: 42px; height: 42px; }
      .settings, .progress-card { padding: 16px; }
      .list-card { padding: 18px 12px; }
      .hero { padding: 20px; border-radius: 22px; }
      .controls { gap: 8px; }
      .action-btn { min-height: 67px; padding: 11px; }
      .action-btn .action-label { font-size: 15px; }
      .round-list { gap: 10px; padding-right: 5px; padding-left: 5px; }
      .round-item { min-height: 112px; padding: 11px; }
      .list-header { align-items: flex-start; flex-direction: column; margin-left: 5px; margin-right: 5px; }
      .list-header span { text-align: left; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">eXP</div>
        <div>
          <h1>EXP Stock Game</h1>
          <p>성공과 실패로 쌓아가는 투자 시뮬레이션</p>
        </div>
      </div>
      <div class="status">
        복리 기준 시뮬레이션<br />
        <span id="currentStatus">게임을 시작하세요</span>
      </div>
    </header>

    <section class="layout">
      <aside class="card settings">
        <h2 class="card-title">게임 설정</h2>

        <div class="field">
          <label for="investment">
            <span>투자금액</span>
            <span>5,000원 ~ 1억원</span>
          </label>
          <input id="investment" type="number" min="5000" max="100000000" step="1000" value="5000" />
        </div>

        <div class="field">
          <label for="rate">
            <span>수익률</span>
            <span>1% ~ 300%</span>
          </label>
          <input id="rate" type="number" min="1" max="300" step="1" value="10" />
        </div>

        <div class="field">
          <label for="rounds">
            <span>총 회차</span>
            <span>1회 ~ 1,000회</span>
          </label>
          <input id="rounds" type="number" min="1" max="1000" step="1" value="100" />
        </div>

        <button class="primary-btn" id="startButton">시뮬레이션 시작</button>
      </aside>

      <section class="game">
        <div class="hero">
          <div class="hero-content">
            <div class="eyebrow">Progress Investment</div>

            <div class="hero-stats">
              <div class="stat">
                <span class="stat-label">시작금액</span>
                <strong id="heroInvestment">₩5,000</strong>
              </div>
              <div class="stat">
                <span class="stat-label">도달 시 금액</span>
                <strong id="heroReachedAmount" class="highlight">₩68,905</strong>
              </div>
              <div class="stat">
                <span class="stat-label">회차 수</span>
                <strong id="heroRounds">0 / 100회</strong>
              </div>
              <div class="stat">
                <span class="stat-label">수익률</span>
                <strong id="heroRate">10%</strong>
              </div>
              <div class="stat">
                <span class="stat-label">도달 시 총수익률</span>
                <strong id="heroTotalRate" class="highlight">1,278.93%</strong>
              </div>
              <div class="stat">
                <span class="stat-label">현재 진행 금액</span>
                <strong id="heroCurrentAmount" class="highlight">₩5,000</strong>
              </div>
              <div class="stat">
                <span class="stat-label">현재 진행 수익률</span>
                <strong id="heroCurrentRate" class="highlight">0%</strong>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="action-btn success" id="successButton">
            <span class="action-label">성공 +1</span>
            <small>청량한 상승 효과음</small>
          </button>
          <button class="action-btn failure" id="failureButton">
            <span class="action-label">실패 -1</span>
            <small>실패 효과음과 함께 이전 회차</small>
          </button>
        </div>

        <div class="card progress-card">
          <div class="progress-head">
            <h3>현재 진행률</h3>
            <div class="progress-number" id="progressText">0 / 100회</div>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <div class="card list-card">
          <div class="list-header">
            <h3>수익률 리스트</h3>
            <span id="listDescription">성공한 회차까지 노란색으로 표시됩니다</span>
          </div>
          <div class="round-list" id="roundList"></div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // 1. Supabase 접속 정보 입력 (Project Settings -> API 메뉴에서 확인)
    const SUPABASE_URL = "https://rflccnybpimhgguwinpz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmbGNjbnlicGltaGdndXdpbnB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzMzMTksImV4cCI6MjEwNDgwOTMxOX0.2oKyodI65QqSMpJyXpcUlDqxF8JEIVsjjN6eUYD5Xcc";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const investmentInput = document.getElementById("investment");
    const rateInput = document.getElementById("rate");
    const roundsInput = document.getElementById("rounds");
    const startButton = document.getElementById("startButton");
    const successButton = document.getElementById("successButton");
    const failureButton = document.getElementById("failureButton");
    const roundList = document.getElementById("roundList");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const currentStatus = document.getElementById("currentStatus");
    const listDescription = document.getElementById("listDescription");
    const heroInvestment = document.getElementById("heroInvestment");
    const heroReachedAmount = document.getElementById("heroReachedAmount");
    const heroRounds = document.getElementById("heroRounds");
    const heroRate = document.getElementById("heroRate");
    const heroTotalRate = document.getElementById("heroTotalRate");
    const heroCurrentAmount = document.getElementById("heroCurrentAmount");
    const heroCurrentRate = document.getElementById("heroCurrentRate");
    const toast = document.getElementById("toast");

    let game = {
      id: null, // Supabase 데이터의 레코드 ID
      investment: 5000,
      rate: 10,
      rounds: 100,
      current: 0,
      values: []
    };

    let audioContext = null;

    function getAudioContext() {
      if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        audioContext = new AudioContext();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function playTone({ frequency, endFrequency, duration, type, volume }) {
      const context = getAudioContext();
      if (!context) return;

      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const now = context.currentTime;

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(endFrequency, 1), now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start(now);
      oscillator.stop(now + duration + 0.03);
    }

    function playSuccessSound() {
      playTone({ frequency: 520, endFrequency: 960, duration: 0.16, type: "sine", volume: 0.085 });
      setTimeout(() => {
        playTone({ frequency: 760, endFrequency: 1280, duration: 0.19, type: "sine", volume: 0.065 });
      }, 70);
    }

    function playFailureSound() {
      playTone({ frequency: 300, endFrequency: 170, duration: 0.22, type: "triangle", volume: 0.09 });
      setTimeout(() => {
        playTone({ frequency: 190, endFrequency: 105, duration: 0.18, type: "sine", volume: 0.055 });
      }, 70);
    }

    function formatMoney(value) {
      if (!Number.isFinite(value)) return "계산 불가";
      if (value >= 1e15) return "₩" + value.toExponential(2);
      return "₩" + Math.round(value).toLocaleString("ko-KR");
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return "계산 불가";
      if (Math.abs(value) >= 1e12) return value.toExponential(2) + "%";
      return value.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "%";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
    }

    function validateInputs() {
      let investment = Number(investmentInput.value);
      let rate = Number(rateInput.value);
      let rounds = Number(roundsInput.value);

      if (!Number.isFinite(investment)) investment = 5000;
      if (!Number.isFinite(rate)) rate = 10;
      if (!Number.isFinite(rounds)) rounds = 100;

      investment = Math.min(Math.max(investment, 5000), 100000000);
      rate = Math.min(Math.max(rate, 1), 300);
      rounds = Math.min(Math.max(Math.floor(rounds), 1), 1000);

      investmentInput.value = investment;
      rateInput.value = rate;
      roundsInput.value = rounds;

      return { investment, rate, rounds };
    }

    /* Supabase 비동기 데이터 로딩 및 동기화 함수 */
    async function loadGameFromSupabase() {
      try {
        const { data, error } = await supabase
          .from('user_game_progress')
          .select('*')
          .order('updated_at', { ascending: false })
          .limit(1);

        if (error) throw error;

        if (data && data.length > 0) {
          const row = data[0];
          game.id = row.id;
          game.investment = Number(row.investment);
          game.rate = Number(row.rate);
          game.rounds = Number(row.rounds);
          game.current = Number(row.current_round);

          investmentInput.value = game.investment;
          rateInput.value = game.rate;
          roundsInput.value = game.rounds;

          recalculateValues();
          showToast("저장된 게임 데이터를 불러왔습니다.");
        } else {
          buildGame();
        }
      } catch (err) {
        console.error("Data load failed:", err);
        buildGame();
      }
    }

    async function saveProgressToSupabase() {
      if (SUPABASE_URL === "https://rflccnybpimhgguwinpz.supabase.co") return;

      const payload = {
        investment: game.investment,
        rate: game.rate,
        rounds: game.rounds,
        current_round: game.current,
        updated_at: new Date()
      };

      try {
        if (game.id) {
          await supabase.from('user_game_progress').update(payload).eq('id', game.id);
        } else {
          const { data } = await supabase.from('user_game_progress').insert([payload]).select();
          if (data && data.length > 0) game.id = data[0].id;
        }
      } catch (err) {
        console.error("Data save failed:", err);
      }
    }

    function recalculateValues() {
      game.values = [];
      let amount = game.investment;
      const multiplier = 1 + game.rate / 100;

      for (let index = 1; index <= game.rounds; index++) {
        amount *= multiplier;
        game.values.push(amount);
      }

      updateHeader();
      renderList();
      updateProgress();
    }

    function buildGame() {
      const settings = validateInputs();

      game = {
        id: game.id,
        ...settings,
        current: 0,
        values: []
      };

      recalculateValues();
      saveProgressToSupabase();
      showToast("새로운 시뮬레이션이 시작되었습니다.");
    }

    function getCurrentAmount() {
      if (game.current <= 0) return game.investment;
      return game.values[game.current - 1];
    }

    function getCurrentTotalRate() {
      const currentAmount = getCurrentAmount();
      return ((currentAmount / game.investment) - 1) * 100;
    }

    function getCompletedAmount() {
      if (game.values.length === 0) return game.investment;
      return game.values[game.values.length - 1];
    }

    function getCompletedTotalRate() {
      const completedAmount = getCompletedAmount();
      return ((completedAmount / game.investment) - 1) * 100;
    }

    function updateHeader() {
      const currentAmount = getCurrentAmount();
      const currentRate = getCurrentTotalRate();
      const completedAmount = getCompletedAmount();
      const completedRate = getCompletedTotalRate();

      heroInvestment.textContent = formatMoney(game.investment);
      heroReachedAmount.textContent = formatMoney(completedAmount);
      heroTotalRate.textContent = formatPercent(completedRate);
      heroRounds.textContent = `${game.current} / ${game.rounds}회`;
      heroRate.textContent = `${game.rate}%`;

      heroCurrentAmount.textContent = formatMoney(currentAmount);
      heroCurrentRate.textContent = formatPercent(currentRate);
      listDescription.textContent = `현재 ${game.current}회까지 성공`;
    }

    function renderList() {
      roundList.innerHTML = "";

      if (!game.values.length) {
        roundList.innerHTML = `<div class="empty">시뮬레이션을 시작하면 회차별 리스트가 표시됩니다.</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      game.values.forEach((value, index) => {
        const round = index + 1;
        const totalRate = ((value / game.investment) - 1) * 100;
        const item = document.createElement("article");

        item.className = "round-item";
        if (round <= game.current) item.classList.add("reached");
        if (round === game.current) item.classList.add("current");

        item.innerHTML = `
          <div class="round-top">
            <span>${round}회차</span>
            <em>${round <= game.current ? "SUCCESS" : "LOCKED"}</em>
          </div>
          <div class="round-value">${formatMoney(value)}</div>
          <div class="round-profit">
            회차 수익률 +${game.rate}%<br />
            누적 수익률 +${formatPercent(totalRate)}
          </div>
        `;
        fragment.appendChild(item);
      });

      roundList.appendChild(fragment);

      const currentElement = roundList.querySelector(".round-item.current");
      if (currentElement) {
        currentElement.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function updateProgress() {
      const percentage = game.rounds === 0 ? 0 : Math.min((game.current / game.rounds) * 100, 100);

      progressBar.style.width = `${percentage}%`;
      progressText.textContent = `${game.current} / ${game.rounds}회`;
      currentStatus.textContent = game.current === 0 ? "게임을 시작하세요" : `${game.current}회차 진행 중`;

      updateHeader();
    }

    function move(step) {
      const next = game.current + step;

      if (next < 0) {
        playFailureSound();
        showToast("첫 번째 회차보다 아래로 내려갈 수 없습니다.");
        return;
      }

      if (next > game.rounds) {
        playSuccessSound();
        showToast("모든 회차에 도달했습니다.");
        return;
      }

      if (step > 0) playSuccessSound();
      else playFailureSound();

      game.current = next;

      renderList();
      updateProgress();
      saveProgressToSupabase();

      if (game.current === game.rounds) {
        showToast("축하합니다! 모든 회차에 도달했습니다.");
      }
    }

    startButton.addEventListener("click", buildGame);
    successButton.addEventListener("click", () => move(1));
    failureButton.addEventListener("click", () => move(-1));

    [investmentInput, rateInput, roundsInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") buildGame();
      });
    });

    // 앱 실행 시 Supabase 데이터 조회
    loadGameFromSupabase();
  </script>
</body>
</html>
