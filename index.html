<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="성공과 실패로 한 회차씩 쌓아가는 EXP 복리 투자 시뮬레이션 대시보드" />
  <title>EXP Stock Game</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop stop-color='%23ff2d2d'/%3E%3Cstop offset='.35' stop-color='%23ffd21a'/%3E%3Cstop offset='.65' stop-color='%231ec8ff'/%3E%3Cstop offset='1' stop-color='%232ee06a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%23050505'/%3E%3Crect x='8' y='46' width='48' height='5' rx='2.5' fill='url(%23g)'/%3E%3Ctext x='32' y='34' text-anchor='middle' font-family='Arial' font-size='20' font-weight='300' fill='white'%3Eexp%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @property --p {
      syntax: "<number>";
      inherits: true;
      initial-value: 0;
    }

    :root {
      --page: #050505;
      --card: #0b0b0d;
      --card-2: #0e0e11;
      --line: rgba(255, 255, 255, 0.07);
      --line-2: rgba(255, 255, 255, 0.12);
      --text: #f4f4f6;
      --soft: #c9c9d1;
      --muted: #8a8a94;
      --dim: #55555e;
      --green: #3ee07a;
      --red: #ff3b3b;
      --blue: #2f6bff;

      --spectrum: linear-gradient(90deg, #ff2d2d 0%, #ff7a1a 17%, #ffd21a 35%, #3ee07a 52%, #1ec8ff 68%, #3a5bff 84%, #2ee06a 100%);

      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --font: "Red Hat Display", "Pretendard Variable", Pretendard, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; background: var(--page); }

    body {
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; padding: 0; }
    :focus-visible { outline: 2px solid #9fb6ff; outline-offset: 3px; }

    /* ───────── Layout ───────── */
    .app {
      display: grid;
      grid-template-columns: minmax(440px, 520px) minmax(0, 1fr);
      gap: 28px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 28px 40px;
    }

    .col-left {
      position: sticky;
      top: 28px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ───────── Header ───────── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .circle-btn {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      transition: background 0.2s, border-color 0.2s, transform 0.18s var(--ease);
    }

    .circle-btn:hover { background: #141417; border-color: var(--line-2); }
    .circle-btn:active { transform: scale(0.94); }
    .circle-btn svg { width: 22px; height: 22px; }

    .top-right { display: flex; gap: 10px; }

    #refreshBtn[data-state="loading"] svg,
    #refreshBtn[data-state="saving"] svg { animation: spin 0.9s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .title {
      margin: 6px 0 0;
      font-size: clamp(40px, 3.6vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .title .t1 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .title .t2 {
      display: block;
      font-weight: 300;
    }

    .avatar {
      position: relative;
      flex: none;
      width: 0.86em;
      height: 0.86em;
      border-radius: 50%;
      background: conic-gradient(from 200deg, #ff2d2d, #ff7a1a, #ffd21a, #3ee07a, #1ec8ff, #3a5bff, #ff2d2d);
      box-shadow: 0 0 24px -4px rgba(255, 150, 60, 0.6);
    }

    .avatar::after {
      content: "exp";
      position: absolute;
      inset: 3px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #0b0b0d;
      font-size: 0.26em;
      font-weight: 500;
      letter-spacing: 0;
      color: #fff;
    }

    /* ───────── Tabs ───────── */
    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      flex: 1 1 auto;
      min-height: 56px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      font-size: 15px;
      font-weight: 400;
      color: var(--soft);
      white-space: nowrap;
      transition: color 0.2s, background 0.2s;
    }

    .tab:hover { color: #fff; background: rgba(255, 255, 255, 0.03); }

    .tab[aria-selected="true"] {
      color: #fff;
      border-color: transparent;
      background:
        linear-gradient(var(--page), var(--page)) padding-box,
        linear-gradient(115deg, #3ee07a, #1ec8ff 55%, #3a5bff) border-box;
    }

    /* ───────── Hero card ───────── */
    .hero {
      --p: 0;
      position: relative;
      padding: 30px 32px 0;
      border-radius: 36px;
      background: var(--card);
      border: 1px solid var(--line);
      overflow: hidden;
      isolation: isolate;
      transition: --p 1s var(--ease);
    }

    .hero-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .score {
      flex: 0 1 auto;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: clamp(92px, 8.4vw, 132px);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.045em;
      white-space: nowrap;
      transform-origin: left bottom;
    }

    .score .cur {
      font-size: 0.42em;
      font-weight: 300;
      vertical-align: 0.9em;
      margin-right: 0.04em;
      letter-spacing: 0;
      color: var(--soft);
    }

    .score .u {
      font-size: 0.46em;
      font-weight: 300;
      margin-left: 0.04em;
      letter-spacing: -0.02em;
    }

    .score.pop { animation: pop 0.5s var(--ease); }
    .score.shake { animation: shake 0.42s var(--ease); }

    @keyframes pop {
      0% { transform: scale(0.97); }
      45% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      20% { transform: translateX(-10px); }
      45% { transform: translateX(8px); }
      70% { transform: translateX(-4px); }
    }

    .delta {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 400;
      color: var(--soft);
      white-space: nowrap;
    }

    .delta svg { width: 15px; height: 15px; color: var(--green); }

    .hero-spacer { flex: 1; }

    .stamp {
      flex: none;
      margin-top: 10px;
      text-align: right;
      white-space: nowrap;
    }

    .stamp b {
      display: block;
      font-size: 16px;
      font-weight: 400;
      color: var(--soft);
    }

    .stamp small {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 4px;
      font-size: 13px;
      color: var(--dim);
    }

    .stamp small i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
    }

    .stamp[data-state="ok"] small i { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .stamp[data-state="saving"] small i,
    .stamp[data-state="loading"] small i { background: #ffd21a; box-shadow: 0 0 8px #ffd21a; }
    .stamp[data-state="error"] small i { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .tier {
      position: relative;
      z-index: 2;
      margin: 26px 0 0;
      font-size: 22px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: -0.01em;
    }

    .exact {
      position: relative;
      z-index: 2;
      margin: 6px 0 30px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.42);
      font-variant-numeric: tabular-nums;
    }

    .haze {
      position: absolute;
      left: -6%;
      bottom: -20px;
      z-index: -1;
      width: calc(38% + var(--p) * 74%);
      height: 72%;
      background: var(--spectrum);
      background-size: calc(100% / (0.38 + var(--p) * 0.74)) 100%;
      filter: blur(44px);
      opacity: calc(0.42 + var(--p) * 0.36);
      -webkit-mask-image: linear-gradient(to top, #000 15%, transparent 95%);
      mask-image: linear-gradient(to top, #000 15%, transparent 95%);
      pointer-events: none;
    }

    .marker {
      position: absolute;
      left: calc(var(--p) * 100%);
      bottom: 7px;
      width: 1px;
      height: 58%;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .spectrum {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      background: var(--spectrum);
    }

    .spectrum i {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: calc(var(--p) * 100%);
      background: rgba(5, 5, 5, 0.62);
    }

    /* ───────── Summary strip ───────── */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-radius: 26px;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .sum {
      padding: 18px 22px;
    }

    .sum + .sum { border-left: 1px solid var(--line); }

    .sum span {
      display: block;
      font-size: 13px;
      color: var(--muted);
    }

    .sum b {
      display: block;
      margin-top: 6px;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sum b small { font-size: 14px; color: var(--muted); font-weight: 400; }

    /* ───────── Dock ───────── */
    .dock {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .dock-main,
    .dock-alt {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 500;
      transition: transform 0.18s var(--ease), background 0.2s, color 0.2s, border-color 0.2s;
    }

    .dock-main {
      flex: 1.4;
      color: #050505;
      background: #fff;
    }

    .dock-main:hover { background: #e9ecf5; }

    .dock-alt {
      flex: 1;
      color: var(--soft);
      border: 1px solid var(--line-2);
    }

    .dock-alt:hover { color: #fff; border-color: rgba(255, 59, 59, 0.6); }
    .dock-alt[aria-disabled="true"] { opacity: 0.4; }

    .dock-main:active, .dock-alt:active, .dock-icon:active { transform: scale(0.96); }
    .dock-main svg, .dock-alt svg { width: 22px; height: 22px; }

    .dock-icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      color: var(--muted);
      border: 1px solid var(--line);
      transition: color 0.2s, background 0.2s, transform 0.18s var(--ease);
    }

    .dock-icon:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .dock-icon svg { width: 22px; height: 22px; }
    .dock-icon .off { display: none; }
    .dock-icon[aria-pressed="false"] .on { display: none; }
    .dock-icon[aria-pressed="false"] .off { display: block; }

    .keys {
      margin: -8px 0 0;
      text-align: center;
      font-size: 12px;
      color: var(--dim);
    }

    .keys kbd {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      margin: 0 3px;
      padding: 0 5px;
      border-radius: 7px;
      font-family: var(--font);
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ───────── Accordion stack (right) ───────── */
    .stack {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .acc {
      position: relative;
      border-radius: 34px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 -14px 36px -10px rgba(0, 0, 0, 0.7);
    }

    .acc:not(:last-child) { padding-bottom: 30px; }
    .acc + .acc { margin-top: -30px; }
    .acc:nth-child(1) { z-index: 1; }
    .acc:nth-child(2) { z-index: 2; }
    .acc:nth-child(3) { z-index: 3; }
    .acc:nth-child(4) { z-index: 4; }

    .acc.chart-card {
      background:
        radial-gradient(120% 70% at 20% 0%, rgba(92, 64, 170, 0.22), rgba(0, 0, 0, 0) 60%),
        linear-gradient(180deg, #121019 0%, #0b0b0f 100%);
    }

    .acc.tile-card { background: var(--card-2); }
    .acc.set-card { background: #101013; }

    .acc-head {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 28px 32px;
      text-align: left;
    }

    .acc-head h2 {
      flex: 1;
      margin: 0;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: -0.015em;
    }

    .acc-head .sub {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .badge {
      display: grid;
      place-items: center;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 0 18px -4px var(--red);
    }

    .badge[hidden] { display: none; }

    .chev {
      flex: none;
      width: 22px;
      height: 22px;
      color: var(--soft);
      transition: transform 0.35s var(--ease);
    }

    .acc[data-open="true"] .chev { transform: rotate(180deg); }

    .acc-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s var(--ease);
    }

    .acc[data-open="true"] .acc-body { grid-template-rows: 1fr; }

    .acc-inner {
      min-height: 0;
      overflow: hidden;
    }

    .acc-pad { padding: 0 32px 30px; }

    /* ───────── Recent log ───────── */
    .log {
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .log-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .log-ico {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .log-ico svg { width: 18px; height: 18px; }
    .log-ico.up { color: var(--green); background: rgba(62, 224, 122, 0.1); }
    .log-ico.down { color: var(--red); background: rgba(255, 59, 59, 0.1); }
    .log-ico.new { color: #9fb6ff; background: rgba(47, 107, 255, 0.12); }

    .log-row b {
      display: block;
      font-size: 16px;
      font-weight: 400;
    }

    .log-row small {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .log-row time {
      font-size: 13px;
      color: var(--dim);
      white-space: nowrap;
    }

    .empty {
      margin: 0;
      padding: 18px 0 4px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--muted);
    }

    /* ───────── Chart ───────── */
    .seg {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .seg button {
      min-height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      font-size: 13px;
      color: var(--soft);
      transition: color 0.2s, background 0.2s;
    }

    .seg button:hover { color: #fff; }
    .seg button[aria-pressed="true"] { color: #050505; background: #fff; border-color: #fff; }
    .seg .gap { flex: 1; }

    .chart {
      position: relative;
      height: 300px;
      touch-action: pan-y;
    }

    .chart svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis-y span {
      position: absolute;
      left: 0;
      transform: translateY(-50%);
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .axis-x span {
      position: absolute;
      bottom: 0;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
    }

    .flag {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 18px;
      background: rgba(20, 20, 26, 0.9);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
      transition: left 0.18s var(--ease), top 0.18s var(--ease);
    }

    .flag b {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .flag em {
      font-style: normal;
      font-size: 13px;
      font-weight: 600;
      background: linear-gradient(90deg, #1ec8ff, #3a5bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .flag em.future {
      background: none;
      color: var(--muted);
      font-weight: 400;
    }

    /* ───────── Tiles ───────── */
    .progress {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .track {
      position: relative;
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: var(--spectrum);
      background-size: 100vw 100%;
      transition: width 0.6s var(--ease);
    }

    .progress span {
      font-size: 14px;
      color: var(--soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .grid-wrap {
      max-height: 360px;
      overflow-y: auto;
      padding: 6px 6px 6px 2px;
      margin: 0 -6px 0 -2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .round-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 8px;
    }

    .tile {
      position: relative;
      aspect-ratio: 1;
      border-radius: 15px;
      background: #131317;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      font-weight: 500;
      color: #4d4d57;
      font-variant-numeric: tabular-nums;
      transition: background 0.4s var(--ease), color 0.3s, border-color 0.3s, box-shadow 0.4s var(--ease), transform 0.3s var(--ease);
    }

    .tile:hover { border-color: rgba(255, 255, 255, 0.25); color: #bbb; }

    .tile.reached {
      color: #fff;
      border-color: transparent;
      background:
        radial-gradient(110% 110% at 28% 18%, color-mix(in srgb, var(--c) 78%, #fff 22%) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 45%, #000) 100%);
      box-shadow: 0 0 20px -8px var(--c);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    .tile.next {
      color: #fff;
      border: 1px dashed rgba(255, 255, 255, 0.45);
    }

    .tile.current {
      z-index: 1;
      transform: scale(1.06);
      box-shadow: 0 0 0 2px var(--page), 0 0 0 3.5px #fff, 0 0 30px -4px var(--c);
    }

    .tile.bloom { animation: bloom 0.7s var(--ease); }

    @keyframes bloom {
      0% { transform: scale(0.8); filter: brightness(2) saturate(1.3); }
      55% { transform: scale(1.14); filter: brightness(1.2); }
      100% { transform: scale(1.06); filter: none; }
    }

    .tile.sink { animation: sink 0.5s var(--ease); }

    @keyframes sink {
      0% { transform: scale(1.06); }
      40% { transform: scale(0.86); }
      100% { transform: scale(1); }
    }

    .round-grid.complete .tile { animation: wave 1.3s var(--ease) var(--d, 0ms) both; }

    @keyframes wave {
      45% { transform: scale(1.14); filter: brightness(1.6); }
    }

    /* ───────── Settings ───────── */
    .field + .field { margin-top: 26px; }

    .field-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .field-top label {
      font-size: 15px;
      color: var(--soft);
    }

    .val {
      width: 190px;
      padding: 0 0 2px;
      border: 0;
      border-bottom: 1px dashed transparent;
      outline: none;
      background: transparent;
      text-align: right;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #fff;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.2s;
    }

    .val:hover { border-bottom-color: rgba(255, 255, 255, 0.25); }
    .val:focus { border-bottom-color: var(--accent); }

    .range {
      --fill: 0%;
      width: 100%;
      height: 30px;
      margin: 0;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .range::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) var(--fill), rgba(255, 255, 255, 0.09) var(--fill));
    }

    .range::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) var(--fill), rgba(255, 255, 255, 0.09) var(--fill));
    }

    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.65), 0 0 18px var(--accent);
      transition: transform 0.15s var(--ease);
    }

    .range::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.65), 0 0 18px var(--accent);
    }

    .range:active::-webkit-slider-thumb { transform: scale(1.18); }
    .range:focus-visible { outline: none; }
    .range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px #9fb6ff, 0 0 18px var(--accent); }

    .field-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 12px;
      color: var(--dim);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .chips button {
      min-height: 32px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      font-size: 13px;
      color: var(--soft);
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }

    .chips button:hover { color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    .chips button.on { color: #050505; background: #ffd21a; border-color: #ffd21a; }

    .set-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .preview {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      word-break: keep-all;
    }

    .preview strong { color: #ffd21a; font-weight: 500; }
    .preview .hint { display: block; font-size: 13px; color: var(--dim); }
    .preview .hint.dirty { color: #ffd21a; }

    .start {
      flex: none;
      min-width: 210px;
      min-height: 56px;
      padding: 0 26px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      border: 1px solid var(--line-2);
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.18s var(--ease);
    }

    .start:hover { background: rgba(255, 255, 255, 0.06); }
    .start:active { transform: scale(0.97); }
    .start.dirty { color: #050505; background: #fff; border-color: #fff; }
    .start.armed { color: #fff; background: var(--red); border-color: var(--red); }

    /* ───────── Toast ───────── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 50;
      max-width: calc(100% - 40px);
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 15px;
      color: #fff;
      background: rgba(18, 18, 24, 0.9);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transform: translate(-50%, 16px);
      pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ───────── Responsive ───────── */
    @media (max-width: 1080px) {
      .app {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        max-width: 720px;
        padding: calc(14px + env(safe-area-inset-top)) 14px calc(112px + env(safe-area-inset-bottom));
      }

      .col-left { position: static; gap: 16px; min-width: 0; }
      .tab { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; }
      .hero-row { gap: 8px; }
      .circle-btn { width: 50px; height: 50px; }
      .title { font-size: clamp(34px, 9vw, 46px); }
      .tab { min-height: 48px; padding: 0 14px; font-size: 14px; }
      .hero { padding: 24px 22px 0; border-radius: 30px; }
      .score { font-size: clamp(64px, 19vw, 110px); }
      .delta, .stamp b { font-size: 14px; }
      .stamp small { font-size: 12px; }
      .tier { margin-top: 18px; font-size: 19px; }
      .exact { margin-bottom: 24px; }
      .sum { padding: 14px 16px; }
      .sum b { font-size: 19px; }

      .dock-wrap {
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 30;
        width: min(560px, calc(100% - 24px));
        transform: translateX(-50%);
      }

      .dock {
        background: rgba(11, 11, 13, 0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 -10px 40px -8px rgba(0, 0, 0, 0.9);
      }

      .dock-main, .dock-alt { min-height: 58px; font-size: 16px; }
      .dock-icon { width: 58px; height: 58px; }
      .keys { display: none; }

      .acc { border-radius: 28px; }
      .acc-head { padding: 22px 22px; }
      .acc-head h2 { font-size: 21px; }
      .acc-pad { padding: 0 22px 24px; }
      .chart { height: 250px; }
      .round-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
      .set-foot { flex-direction: column; align-items: stretch; }
      .start { width: 100%; }
      .toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
    }

    @media (max-width: 420px) {
      .acc-head .sub { display: none; }
      .delta { display: none; }
      .tab { padding: 0 8px; font-size: 13px; }
      .stamp small span { display: none; }
      .val { width: 150px; font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

    let logState = { items: [], unseen: 0 };
    let lastSaved = null;
    let syncState = "loading";

    /* ═════════════ 유틸 ═════════════ */
    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
    const fmtInt = (n) => Math.round(n).toLocaleString("ko-KR");

    function readPref(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function writePref(key, value) { try { localStorage.setItem(key, value); } catch {} }

    function formatMoney(value) {
      if (!Number.isFinite(value)) return "계산 범위 초과";
      if (value >= 1e15) return "₩" + value.toExponential(2);
      return "₩" + fmtInt(value);
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return "계산 범위 초과";
      if (Math.abs(value) >= 1e12) return value.toExponential(2) + "%";
      return value.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "%";
    }

    function compactParts(value) {
      if (!Number.isFinite(value)) return { n: "∞", u: "" };
      if (value >= 1e24) return { n: value.toExponential(2).replace("e+", "e"), u: "" };
      const units = [[1e20, "해"], [1e16, "경"], [1e12, "조"], [1e8, "억"], [1e4, "만"]];
      for (const [base, unit] of units) {
        if (value >= base) {
          const x = value / base;
          const digits = x < 10 ? 2 : x < 100 ? 1 : 0;
          return { n: x.toLocaleString("ko-KR", { maximumFractionDigits: digits }), u: unit };
        }
      }
      return { n: fmtInt(value), u: "" };
    }

    const compactText = (value) => { const { n, u } = compactParts(value); return "₩" + n + u; };

    function compactPercentParts(value) {
      if (!Number.isFinite(value)) return { n: "∞", u: "%" };
      if (value >= 1e6) {
        const { n, u } = compactParts(value);
        return { n: "+" + n + u, u: "%" };
      }
      return { n: "+" + value.toLocaleString("ko-KR", { maximumFractionDigits: value < 100 ? 2 : 1 }), u: "%" };
    }

    function relTime(ts) {
      if (!ts) return "—";
      const s = Math.max(0, (Date.now() - ts) / 1000);
      if (s < 10) return "방금 전";
      if (s < 60) return `${Math.floor(s)}초 전`;
      if (s < 3600) return `${Math.floor(s / 60)}분 전`;
      if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
      return `${Math.floor(s / 86400)}일 전`;
    }

    function fitText(node) {
      node.style.fontSize = "";
      let size = parseFloat(getComputedStyle(node).fontSize);
      let guard = 0;
      while (node.scrollWidth > node.clientWidth + 1 && size > 36 && guard < 50) {
        size -= 3;
        node.style.fontSize = size + "px";
        guard++;
      }
    }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove("show"), 2400);
    }

    function restartAnimation(node, className) {
      node.classList.remove(className);
      void node.offsetWidth;
      node.classList.add(className);
    }

    /* 스펙트럼 색 — 히어로 바와 동일한 스톱 */
    const SPECTRUM = [
      [0, [255, 45, 45]], [0.17, [255, 122, 26]], [0.35, [255, 210, 26]], [0.52, [62, 224, 122]],
      [0.68, [30, 200, 255]], [0.84, [58, 91, 255]], [1, [46, 224, 106]]
    ];

    function colorAt(t) {
      t = clamp(t, 0, 1);
      for (let i = 1; i < SPECTRUM.length; i++) {
        const [t1, c1] = SPECTRUM[i];
        const [t0, c0] = SPECTRUM[i - 1];
        if (t <= t1) {
          const k = (t - t0) / (t1 - t0 || 1);
          const c = c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
          return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
        }
      }
      return "rgb(46, 224, 106)";
    }

    /* ═════════════ 사운드 ═════════════ */
    let audioContext = null;

    function getAudioContext() {
      if (!audioContext) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioContext = new Ctx();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playTone({ frequency, endFrequency, duration, type, volume, delay = 0 }) {
      if (!soundOn) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 4200;
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(endFrequency, 1), now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.05);
    }

    function playSuccessSound(progress = 0) {
      const base = 480 * Math.pow(2, clamp(progress, 0, 1) * 0.75);
      playTone({ frequency: base, endFrequency: base * 1.5, duration: 0.14, type: "sine", volume: 0.08 });
      playTone({ frequency: base * 1.26, endFrequency: base * 2, duration: 0.18, type: "sine", volume: 0.06, delay: 0.06 });
      playTone({ frequency: base * 2, endFrequency: base * 2.52, duration: 0.24, type: "triangle", volume: 0.03, delay: 0.12 });
    }

    function playFailureSound() {
      playTone({ frequency: 310, endFrequency: 165, duration: 0.24, type: "triangle", volume: 0.09 });
      playTone({ frequency: 190, endFrequency: 98, duration: 0.2, type: "sine", volume: 0.06, delay: 0.07 });
    }

    function playCompleteSound() {
      [523, 659, 784, 1046].forEach((f, i) => {
        playTone({ frequency: f, endFrequency: f * 1.02, duration: 0.42, type: "sine", volume: 0.06, delay: i * 0.09 });
      });
    }

    /* ═════════════ 계산 ═════════════ */
    function recalculateValues() {
      game.values = [];
      let amount = game.investment;
      const multiplier = 1 + game.rate / 100;
      for (let i = 1; i <= game.rounds; i++) {
        amount *= multiplier;
        game.values.push(amount);
      }
    }

    const amountAt = (round) => (round <= 0 ? game.investment : game.values[Math.min(round, game.rounds) - 1]);
    const rateAt = (round) => ((amountAt(round) / game.investment) - 1) * 100;

    /* ═════════════ 히어로 ═════════════ */
    function tierOf(p) {
      if (p <= 0) return "출발 대기";
      if (p < 0.25) return "워밍업";
      if (p < 0.5) return "순항 중";
      if (p < 0.75) return "가속 구간";
      if (p < 1) return "정상 직전";
      return "완주 달성";
    }

    function metricValue(key) {
      if (key === "current") return amountAt(game.current);
      if (key === "target") return amountAt(game.rounds);
      return rateAt(game.current);
    }

    function paintScore(key, value) {
      if (key === "rate") {
        const { n, u } = compactPercentParts(value);
        el.score.innerHTML = `${n}<span class="u">${u}</span>`;
      } else {
        const { n, u } = compactParts(value);
        el.score.innerHTML = `<span class="cur">₩</span>${n}${u ? `<span class="u">${u}</span>` : ""}`;
      }
      fitText(el.score);
    }

    let countFrame = null;

    function renderScore(animate) {
      cancelAnimationFrame(countFrame);
      const key = metric;
      const to = metricValue(key);
      const from = displayed[key];
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const isRate = key === "rate";

      if (!animate || reduce || !Number.isFinite(from) || !Number.isFinite(to) || (!isRate && (from <= 0 || to <= 0))) {
        displayed[key] = to;
        paintScore(key, to);
        return;
      }

      const t0 = performance.now();
      const duration = 520;
      const tick = (now) => {
        const t = clamp((now - t0) / duration, 0, 1);
        const e = 1 - Math.pow(1 - t, 3);
        let v;
        if (isRate) {
          const lf = Math.log(from + 100), lt = Math.log(to + 100);
          v = Math.exp(lf + (lt - lf) * e) - 100;
        } else {
          const lf = Math.log(from), lt = Math.log(to);
          v = Math.exp(lf + (lt - lf) * e);
        }
        if (t === 1) v = to;
        displayed[key] = v;
        paintScore(key, v);
        if (t < 1) countFrame = requestAnimationFrame(tick);
      };
      countFrame = requestAnimationFrame(tick);
    }

    function updateHero(animate = false) {
      const p = game.rounds ? game.current / game.rounds : 0;
      const remain = game.rounds - game.current;
      el.hero.style.setProperty("--p", p.toFixed(4));

      // 다른 탭의 표시값은 즉시 맞춰 둔다
      ["current", "target", "rate"].forEach((k) => { if (k !== metric) displayed[k] = metricValue(k); });
      renderScore(animate);

      el.deltaText.textContent = `+${game.rate}% / 회`;
      el.tier.textContent = tierOf(p);

      if (metric === "current") {
        el.exact.textContent = `정확한 금액 ${formatMoney(amountAt(game.current))} · 누적 +${formatPercent(rateAt(game.current))}`;
      } else if (metric === "target") {
        el.exact.textContent = `${fmtInt(game.rounds)}회 모두 성공 시 ${formatMoney(amountAt(game.rounds))} · 총 +${formatPercent(rateAt(game.rounds))}`;
      } else {
        el.exact.textContent = `투자금 ${formatMoney(game.investment)} → 현재 ${formatMoney(amountAt(game.current))}`;
      }

      el.sumDone.innerHTML = `${fmtInt(game.current)}<small> / ${fmtInt(game.rounds)}</small>`;
      el.sumLeft.textContent = remain > 0 ? `${fmtInt(remain)}회` : "완주";
      el.sumPct.textContent = (p * 100).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "%";

      const pct = Math.min(p * 100, 100);
      el.progressBar.style.width = pct + "%";
      el.progressBar.style.backgroundSize = (pct > 0 ? 100 / (pct / 100) : 100) + "% 100%";
      el.progressTrack.setAttribute("aria-valuenow", pct.toFixed(1));
      el.progressText.textContent = `${fmtInt(game.current)} / ${fmtInt(game.rounds)}회`;

      el.failure.setAttribute("aria-disabled", game.current === 0 ? "true" : "false");
      document.title = game.current > 0 ? `${game.current}/${game.rounds} · EXP Stock Game` : "EXP Stock Game";
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        metric = tab.dataset.metric;
        document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t === tab ? "true" : "false"));
        displayed[metric] = metricValue(metric);
        updateHero(false);
      });
    });

    /* ═════════════ 저장 상태 표시 ═════════════ */
    const SYNC_TEXT = { loading: "불러오는 중", saving: "저장 중", ok: "저장됨", error: "이 기기에만 저장됨" };

    function setSync(state) {
      syncState = state;
      el.stamp.dataset.state = state;
      el.refresh.dataset.state = state;
      el.stampState.textContent = SYNC_TEXT[state] || "";
      if (state === "ok" || state === "error") lastSaved = lastSaved || Date.now();
      el.stampTime.textContent = relTime(lastSaved);
    }

    /* ═════════════ 최근 기록 ═════════════ */
    const LOG_ICON = {
      up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
      down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>',
      new: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>'
    };

    function loadLog() {
      try {
        const raw = JSON.parse(readPref(LOG_KEY) || "null");
        if (raw && Array.isArray(raw.items)) logState = { items: raw.items.slice(0, 40), unseen: raw.unseen || 0 };
      } catch {}
    }

    function saveLog() { writePref(LOG_KEY, JSON.stringify(logState)); }

    function addLog(type, round, amount) {
      logState.items.unshift({ type, round, amount, at: Date.now() });
      logState.items = logState.items.slice(0, 40);
      if (el.logCard.dataset.open !== "true") logState.unseen = Math.min(logState.unseen + 1, 99);
      saveLog();
      renderLog();
    }

    function renderLog() {
      const n = logState.unseen;
      el.logBadge.hidden = n === 0;
      el.logBadge.textContent = n > 9 ? "9+" : String(n);

      if (!logState.items.length) {
        el.logList.innerHTML = '<li><p class="empty">아직 기록이 없어요. 성공 버튼을 눌러 첫 회차를 밝혀 보세요.</p></li>';
        return;
      }

      el.logList.innerHTML = logState.items.map((it) => {
        const title = it.type === "up" ? `${fmtInt(it.round)}회차 달성`
          : it.type === "down" ? `${fmtInt(it.round)}회차로 후퇴`
          : "새 게임 시작";
        return `<li class="log-row">
          <span class="log-ico ${it.type}">${LOG_ICON[it.type] || LOG_ICON.new}</span>
          <div><b>${title}</b><small>${formatMoney(it.amount)}</small></div>
          <time>${relTime(it.at)}</time>
        </li>`;
      }).join("");
    }

    /* ═════════════ 플레이 흐름 기록 ═════════════ */
    const sig = () => `${game.investment}|${game.rate}|${game.rounds}`;

    function loadHistory() {
      try {
        const raw = JSON.parse(readPref(HISTORY_KEY) || "null");
        if (raw && raw.sig === sig() && Array.isArray(raw.h) && raw.h.length) {
          history = raw.h.map((v) => clamp(Math.floor(v), 0, game.rounds)).slice(-600);
          if (history[history.length - 1] !== game.current) history.push(game.current);
          return;
        }
      } catch {}
      history = [game.current];
    }

    function pushHistory(round) {
      history.push(round);
      if (history.length > 600) history = history.slice(-600);
      writePref(HISTORY_KEY, JSON.stringify({ sig: sig(), h: history }));
    }

    function resetHistory() {
      history = [0];
      writePref(HISTORY_KEY, JSON.stringify({ sig: sig(), h: history }));
    }

    /* ═════════════ 차트 ═════════════ */
    let chartPts = [];
    let chartGeom = null;

    function smoothPath(pts) {
      if (pts.length < 3) return pts.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join("");
      let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
        const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
        d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
      }
      return d;
    }

    const linePath = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join("");

    function renderChart() {
      const W = el.chart.clientWidth;
      const H = el.chart.clientHeight;
      if (!W || !H) return;

      const pad = { l: W < 480 ? 58 : 76, r: 16, t: 26, b: 30 };
      const iw = W - pad.l - pad.r;
      const ih = H - pad.t - pad.b;
      const R = game.rounds;
      let ticks = [], xLabels = [], solidTo, smooth;

      if (chartMode === "curve") {
        const v0 = game.investment, vmax = amountAt(R);
        const lg = chartScale === "log" && vmax > v0 && Number.isFinite(vmax);
        const lv0 = Math.log(v0), lvm = Math.log(vmax);
        const norm = (v) => lg ? (Math.log(v) - lv0) / (lvm - lv0) : (Number.isFinite(vmax) && vmax > 0 ? v / vmax : 0);

        chartPts = [];
        for (let i = 0; i <= R; i++) {
          chartPts.push({ x: pad.l + (R ? i / R : 0) * iw, y: pad.t + (1 - norm(amountAt(i))) * ih, round: i });
        }
        ticks = [1, 0.66, 0.33, 0].map((f) => ({
          y: pad.t + (1 - f) * ih,
          label: compactText(lg ? Math.exp(lv0 + f * (lvm - lv0)) : vmax * f)
        }));
        xLabels = [[0, "시작"], [0.5, `${fmtInt(Math.round(R / 2))}회`], [1, `${fmtInt(R)}회`]];
        solidTo = game.current;
        smooth = false;
        el.chartSub.textContent = `${lg ? "로그" : "선형"} · 회차별 복리 금액`;
      } else {
        const h = history.length > 1 ? history : [history[0] || 0, history[0] || 0];
        const n = h.length;
        chartPts = h.map((r, k) => ({ x: pad.l + (k / (n - 1)) * iw, y: pad.t + (1 - (R ? r / R : 0)) * ih, round: r, step: k }));
        ticks = [1, 0.66, 0.33, 0].map((f) => ({ y: pad.t + (1 - f) * ih, label: `${fmtInt(Math.round(R * f))}회` }));
        xLabels = [[0, "처음"], [1, `${fmtInt(history.length - 1)}번째 조작`]];
        solidTo = chartPts.length - 1;
        smooth = true;
        el.chartSub.textContent = `성공·실패 ${fmtInt(history.length - 1)}회의 오르내림`;
      }

      chartGeom = { pad, iw, ih, W, H };
      const solid = chartPts.slice(0, solidTo + 1);
      const draw = smooth ? smoothPath : linePath;
      const full = draw(chartPts);
      const bottom = pad.t + ih;
      const area = `${full}L${chartPts[chartPts.length - 1].x.toFixed(1)},${bottom}L${chartPts[0].x.toFixed(1)},${bottom}Z`;
      const solidD = solid.length > 1 ? draw(solid) : "";

      const stops = SPECTRUM.map(([o, c]) => `<stop offset="${o}" stop-color="rgb(${c.join(",")})"/>`).join("");
      const grid = ticks.map((t) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${t.y}" y2="${t.y}" stroke="rgba(255,255,255,0.05)"/>`).join("");
      const dots = chartMode === "flow" && chartPts.length <= 60
        ? chartPts.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="2.2" fill="rgba(255,255,255,0.35)"/>`).join("")
        : "";

      el.svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      el.svg.innerHTML = `
        <defs>
          <linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="${pad.l}" x2="${W - pad.r}" y1="0" y2="0">${stops}</linearGradient>
          <linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#6b4cff" stop-opacity="0.32"/>
            <stop offset="1" stop-color="#6b4cff" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        ${grid}
        <path d="${area}" fill="url(#areaFill)"/>
        <path d="${full}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.4" stroke-dasharray="3 5"/>
        ${solidD ? `<path d="${solidD}" fill="none" stroke="url(#spec)" stroke-width="7" opacity="0.45" filter="url(#glow)"/>
        <path d="${solidD}" fill="none" stroke="url(#spec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
        ${dots}
        <line id="cursorLine" x1="0" x2="0" y1="${pad.t}" y2="${bottom}" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        <circle id="cursorGlow" r="11" fill="#fff" opacity="0.14"/>
        <circle id="cursorDot" r="5" fill="#fff" stroke="#050505" stroke-width="2"/>
      `;

      el.axisY.innerHTML = ticks.map((t) => `<span style="top:${t.y}px">${t.label}</span>`).join("");
      el.axisX.innerHTML = xLabels.map(([f, label]) => {
        const x = pad.l + f * iw;
        const shift = f === 0 ? "translateX(0)" : f === 1 ? "translateX(-100%)" : "translateX(-50%)";
        return `<span style="left:${x}px;transform:${shift}">${label}</span>`;
      }).join("");

      setFlag(defaultFlagIndex());
    }

    const defaultFlagIndex = () => chartMode === "curve" ? game.current : chartPts.length - 1;

    function setFlag(index) {
      if (!chartPts.length || !chartGeom) return;
      const i = clamp(index, 0, chartPts.length - 1);
      const p = chartPts[i];
      const line = $("cursorLine"), dot = $("cursorDot"), glow = $("cursorGlow");
      if (line) { line.setAttribute("x1", p.x); line.setAttribute("x2", p.x); }
      if (dot) { dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); }
      if (glow) { glow.setAttribute("cx", p.x); glow.setAttribute("cy", p.y); }

      if (chartMode === "curve") {
        el.flagVal.textContent = compactText(amountAt(p.round));
        el.flagTag.textContent = p.round === 0 ? "시작" : `${fmtInt(p.round)}회차${p.round > game.current ? " · 예상" : ""}`;
        el.flagTag.classList.toggle("future", p.round > game.current);
      } else {
        el.flagVal.textContent = `${fmtInt(p.round)}회차`;
        el.flagTag.textContent = p.step === 0 ? "처음" : `${fmtInt(p.step)}번째 조작`;
        el.flagTag.classList.remove("future");
      }

      const fw = el.flag.offsetWidth, fh = el.flag.offsetHeight;
      const { W } = chartGeom;
      let left = p.x - fw / 2;
      left = clamp(left, chartGeom.pad.l - 4, W - fw);
      let top = p.y - fh - 18;
      if (top < 0) top = p.y + 18;
      el.flag.style.left = left + "px";
      el.flag.style.top = top + "px";
    }

    el.chart.addEventListener("pointermove", (e) => {
      if (!chartGeom || !chartPts.length) return;
      const rect = el.chart.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const f = (x - chartGeom.pad.l) / chartGeom.iw;
      const idx = Math.round(clamp(f, 0, 1) * (chartPts.length - 1));
      setFlag(idx);
      if (chartMode === "curve") inspect(chartPts[idx].round);
    });

    el.chart.addEventListener("pointerleave", () => {
      setFlag(defaultFlagIndex());
      inspect(game.current);
    });

    document.querySelectorAll(".seg [data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        chartMode = btn.dataset.mode;
        document.querySelectorAll(".seg [data-mode]").forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
        el.scaleBtn.style.visibility = chartMode === "curve" ? "visible" : "hidden";
        renderChart();
      });
    });

    el.scaleBtn.addEventListener("click", () => {
      chartScale = chartScale === "log" ? "linear" : "log";
      el.scaleBtn.setAttribute("aria-pressed", chartScale === "log" ? "true" : "false");
      renderChart();
    });

    if (window.ResizeObserver) new ResizeObserver(() => renderChart()).observe(el.chart);

    /* ═════════════ 회차 타일 ═════════════ */
    function renderTiles() {
      const frag = document.createDocumentFragment();
      tiles = [];
      const span = Math.max(game.rounds - 1, 1);

      for (let round = 1; round <= game.rounds; round++) {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "tile";
        tile.dataset.round = round;
        tile.style.setProperty("--c", colorAt((round - 1) / span));
        tile.style.setProperty("--d", Math.min((round - 1) * 12, 1600) + "ms");
        tile.textContent = round;
        tile.setAttribute("aria-label", `${round}회차 ${formatMoney(game.values[round - 1])}`);
        frag.appendChild(tile);
        tiles.push(tile);
      }

      el.grid.innerHTML = "";
      el.grid.appendChild(frag);
      applyTileStates(1, game.rounds);
    }

    function applyTileStates(from, to) {
      const start = Math.max(1, from);
      const end = Math.min(game.rounds, to);
      for (let round = start; round <= end; round++) {
        const tile = tiles[round - 1];
        tile.classList.toggle("reached", round <= game.current);
        tile.classList.toggle("current", round === game.current);
        tile.classList.toggle("next", round === game.current + 1);
      }
    }

    function scrollToRound(round, smooth = true) {
      const tile = tiles[Math.max(round, 1) - 1];
      if (!tile) return;
      const wrap = el.gridWrap;
      const top = tile.offsetTop - wrap.offsetTop - wrap.clientHeight / 2 + tile.offsetHeight / 2;
      wrap.scrollTo({ top: Math.max(top, 0), behavior: smooth ? "smooth" : "auto" });
    }

    function inspect(round) {
      const r = clamp(round, 0, game.rounds);
      const state = r === 0 ? "시작" : r <= game.current ? "달성" : r === game.current + 1 ? "다음 목표" : "잠김";
      const name = r === 0 ? "시작" : `${fmtInt(r)}회차`;
      el.inspText.textContent = `${name} · ${state} · ${compactText(amountAt(r))} · +${formatPercent(rateAt(r))}`;
    }

    const coarsePointer = window.matchMedia("(hover: none)");
    let inspectTimer = null;

    el.grid.addEventListener("click", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile) return;
      const r = Number(tile.dataset.round);
      inspect(r);
      if (chartMode === "curve") setFlag(r);
      if (coarsePointer.matches) {
        clearTimeout(inspectTimer);
        inspectTimer = setTimeout(() => { inspect(game.current); setFlag(defaultFlagIndex()); }, 3000);
      }
    });

    el.grid.addEventListener("mouseover", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile) return;
      const r = Number(tile.dataset.round);
      inspect(r);
      if (chartMode === "curve") setFlag(r);
    });

    el.grid.addEventListener("focusin", (e) => {
      const tile = e.target.closest(".tile");
      if (tile) inspect(Number(tile.dataset.round));
    });

    el.grid.addEventListener("mouseleave", () => { inspect(game.current); setFlag(defaultFlagIndex()); });

    /* ═════════════ 아코디언 ═════════════ */
    function setOpen(card, open) {
      card.dataset.open = open ? "true" : "false";
      card.querySelector(".acc-head").setAttribute("aria-expanded", open ? "true" : "false");
      card.querySelector(".acc-body").inert = !open;
      if (open && card === el.logCard && logState.unseen) {
        logState.unseen = 0;
        saveLog();
        renderLog();
      }
      if (open && card.id === "chartCard") requestAnimationFrame(renderChart);
    }

    document.querySelectorAll(".acc").forEach((card) => {
      card.querySelector(".acc-body").inert = card.dataset.open !== "true";
      card.querySelector(".acc-head").addEventListener("click", () => setOpen(card, card.dataset.open !== "true"));
    });

    $("menuBtn").addEventListener("click", () => {
      setOpen(el.setCard, true);
      el.setCard.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    /* ═════════════ 설정 슬라이더 ═════════════ */
    function niceMoney(v) {
      const step = Math.pow(10, Math.max(3, Math.floor(Math.log10(v)) - 1));
      return Math.round(v / step) * step;
    }

    const [INV_MIN, INV_MAX] = LIMITS.investment;

    const FIELDS = {
      investment: {
        range: $("investmentRange"),
        input: $("investment"),
        toValue: (t) => clamp(niceMoney(INV_MIN * Math.pow(INV_MAX / INV_MIN, t / 1000)), INV_MIN, INV_MAX),
        toT: (v) => (1000 * Math.log(v / INV_MIN)) / Math.log(INV_MAX / INV_MIN),
        format: (v) => fmtInt(v) + "원"
      },
      rate: {
        range: $("rateRange"),
        input: $("rate"),
        toValue: (t) => Math.round(1 + (299 * t) / 1000),
        toT: (v) => ((v - 1) / 299) * 1000,
        format: (v) => v + "%"
      },
      rounds: {
        range: $("roundsRange"),
        input: $("rounds"),
        toValue: (t) => Math.round(1 + 999 * Math.pow(t / 1000, 2)),
        toT: (v) => 1000 * Math.sqrt((v - 1) / 999),
        format: (v) => fmtInt(v) + "회"
      }
    };

    const PRESETS = [
      [5000, "5천"], [10000, "1만"], [100000, "10만"], [1000000, "100만"],
      [10000000, "1천만"], [100000000, "1억"], [1000000000, "10억"]
    ];

    el.chips.innerHTML = PRESETS.map(([v, label]) => `<button type="button" data-v="${v}">${label}</button>`).join("");
    el.chips.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      draft.investment = Number(btn.dataset.v);
      syncField("investment");
      updatePreview();
    });

    function sanitize(key, value) {
      let v = Number(value);
      if (!Number.isFinite(v)) v = DEFAULTS[key];
      v = clamp(v, ...LIMITS[key]);
      if (key !== "investment") v = Math.floor(v);
      return Math.round(v);
    }

    function syncField(key) {
      const f = FIELDS[key];
      const t = clamp(f.toT(draft[key]), 0, 1000);
      f.range.value = t;
      f.range.style.setProperty("--fill", t / 10 + "%");
      if (document.activeElement !== f.input) f.input.value = f.format(draft[key]);
      if (key === "investment") {
        el.chips.querySelectorAll("button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) === draft.investment));
      }
    }

    function syncAllFields() {
      Object.keys(FIELDS).forEach(syncField);
      updatePreview();
    }

    const isDirty = () => draft.investment !== game.investment || draft.rate !== game.rate || draft.rounds !== game.rounds;

    function updatePreview() {
      const final = draft.investment * Math.pow(1 + draft.rate / 100, draft.rounds);
      el.preview.innerHTML = `${formatMoney(draft.investment)}으로 ${fmtInt(draft.rounds)}회를 모두 성공하면 <strong>${compactText(final)}</strong>`;
      const dirty = isDirty();
      el.start.classList.toggle("dirty", dirty);
      el.hint.classList.toggle("dirty", dirty);
      el.hint.textContent = dirty ? "바뀐 설정은 새 게임을 시작하면 적용돼요." : "숫자를 눌러 직접 입력할 수도 있어요.";
    }

    Object.entries(FIELDS).forEach(([key, f]) => {
      f.range.addEventListener("input", () => {
        draft[key] = f.toValue(Number(f.range.value));
        f.range.style.setProperty("--fill", f.range.value / 10 + "%");
        f.input.value = f.format(draft[key]);
        if (key === "investment") {
          el.chips.querySelectorAll("button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) === draft.investment));
        }
        updatePreview();
      });

      f.input.addEventListener("focus", () => {
        f.input.value = draft[key];
        requestAnimationFrame(() => f.input.select());
      });

      const commit = () => {
        const raw = String(f.input.value).replace(/[^\d.]/g, "");
        draft[key] = sanitize(key, raw === "" ? draft[key] : raw);
        f.input.value = f.format(draft[key]);
        syncField(key);
        updatePreview();
      };

      f.input.addEventListener("blur", commit);
      f.input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") f.input.blur();
        else if (e.key === "Escape") { f.input.value = draft[key]; f.input.blur(); }
      });
    });

    /* ═════════════ 저장 / 불러오기 ═════════════ */
    function writeLocal() {
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify({
          id: game.id, investment: game.investment, rate: game.rate, rounds: game.rounds, current: game.current, savedAt: Date.now()
        }));
      } catch {}
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    let saving = false;
    let saveQueued = false;

    async function saveProgressToSupabase() {
      writeLocal();

      if (!supabaseClient) {
        lastSaved = Date.now();
        setSync("error");
        return;
      }

      if (saving) { saveQueued = true; return; }

      saving = true;
      setSync("saving");

      const payload = {
        investment: game.investment,
        rate: game.rate,
        rounds: game.rounds,
        current_round: game.current,
        updated_at: new Date().toISOString()
      };

      try {
        if (game.id) {
          const { error } = await supabaseClient.from(TABLE).update(payload).eq("id", game.id);
          if (error) throw error;
        } else {
          const { data, error } = await supabaseClient.from(TABLE).insert([payload]).select();
          if (error) throw error;
          if (data && data.length > 0) {
            game.id = data[0].id;
            writeLocal();
          }
        }
        lastSaved = Date.now();
        setSync("ok");
      } catch (err) {
        console.error("Data save error:", err);
        lastSaved = Date.now();
        setSync("error");
      } finally {
        saving = false;
        if (saveQueued) {
          saveQueued = false;
          saveProgressToSupabase();
        }
      }
    }

    function applyGame(source) {
      game = {
        id: source.id ?? null,
        investment: sanitize("investment", source.investment),
        rate: sanitize("rate", source.rate),
        rounds: sanitize("rounds", source.rounds),
        current: 0,
        values: []
      };
      game.current = clamp(Math.floor(Number(source.current) || 0), 0, game.rounds);
      draft = { investment: game.investment, rate: game.rate, rounds: game.rounds };

      recalculateValues();
      loadHistory();
      renderTiles();
      displayed = { current: metricValue("current"), target: metricValue("target"), rate: metricValue("rate") };
      updateHero(false);
      syncAllFields();
      inspect(game.current);
      renderChart();
      requestAnimationFrame(() => scrollToRound(game.current, false));
    }

    async function loadGameFromSupabase(manual = false) {
      setSync("loading");

      try {
        if (!supabaseClient) throw new Error("Supabase client unavailable");

        const { data, error } = await supabaseClient
          .from(TABLE)
          .select("*")
          .order("updated_at", { ascending: false })
          .limit(1);

        if (error) throw error;

        if (data && data.length > 0) {
          const row = data[0];
          const t = Date.parse(row.updated_at);
          lastSaved = Number.isFinite(t) ? t : Date.now();
          applyGame({ id: row.id, investment: row.investment, rate: row.rate, rounds: row.rounds, current: row.current_round });
          setSync("ok");
          showToast(manual ? "최신 기록으로 새로고침했어요." : "저장된 기록을 불러왔어요.");
        } else {
          startNewGame(false);
        }
      } catch (err) {
        console.error("Data load error:", err);
        const local = readLocal();
        if (local) {
          lastSaved = local.savedAt || null;
          applyGame(local);
          showToast("서버에 연결하지 못해 이 기기에 보관된 기록을 불러왔어요.");
        } else {
          startNewGame(false);
        }
        setSync("error");
      }
    }

    /* ═════════════ 게임 진행 ═════════════ */
    function startNewGame(announce = true) {
      Object.keys(draft).forEach((key) => { draft[key] = sanitize(key, draft[key]); });

      game = { id: game.id, ...draft, current: 0, values: [] };
      recalculateValues();
      resetHistory();
      renderTiles();
      displayed = { current: metricValue("current"), target: metricValue("target"), rate: 0 };
      updateHero(false);
      syncAllFields();
      inspect(0);
      renderChart();
      el.gridWrap.scrollTo({ top: 0 });
      saveProgressToSupabase();

      if (announce) {
        addLog("new", 0, game.investment);
        showToast(`새 게임을 시작했어요. ${fmtInt(game.rounds)}회에 도전해 보세요.`);
      }
    }

    function move(step) {
      const prev = game.current;
      const next = prev + step;

      if (next < 0) {
        playFailureSound();
        restartAnimation(el.score, "shake");
        showToast("시작 지점이라 더 내려갈 수 없어요.");
        return;
      }

      if (next > game.rounds) {
        playSuccessSound(1);
        showToast("이미 모든 회차를 달성했어요. 새 게임으로 다시 도전해 보세요.");
        return;
      }

      game.current = next;
      applyTileStates(Math.min(prev, next), Math.max(prev, next) + 1);

      if (navigator.vibrate) {
        try { navigator.vibrate(step > 0 ? 12 : [28, 40, 28]); } catch {}
      }

      if (step > 0) {
        playSuccessSound(next / game.rounds);
        restartAnimation(tiles[next - 1], "bloom");
        restartAnimation(el.score, "pop");
      } else {
        playFailureSound();
        if (tiles[prev - 1]) restartAnimation(tiles[prev - 1], "sink");
        restartAnimation(el.score, "shake");
      }

      pushHistory(next);
      updateHero(true);
      inspect(game.current);
      renderChart();
      scrollToRound(game.current || 1);
      addLog(step > 0 ? "up" : "down", next, amountAt(next));
      saveProgressToSupabase();

      if (step > 0 && next === game.rounds) celebrate();
    }

    function celebrate() {
      setTimeout(playCompleteSound, 180);
      restartAnimation(el.grid, "complete");
      clearTimeout(celebrate.timer);
      celebrate.timer = setTimeout(() => el.grid.classList.remove("complete"), 3400);
      showToast(`축하해요! ${fmtInt(game.rounds)}회를 모두 성공했어요.`);
    }

    /* ═════════════ 이벤트 ═════════════ */
    el.success.addEventListener("click", () => move(1));
    el.failure.addEventListener("click", () => move(-1));
    el.refresh.addEventListener("click", () => loadGameFromSupabase(true));

    function applySoundButton() {
      el.sound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    }

    el.sound.addEventListener("click", () => {
      soundOn = !soundOn;
      writePref(SOUND_KEY, soundOn ? "on" : "off");
      applySoundButton();
      if (soundOn) playSuccessSound(0.3);
      showToast(soundOn ? "효과음을 켰어요." : "효과음을 껐어요.");
    });

    // 진행 중 기록이 있으면 두 번 눌러야 초기화
    let armTimer = null;

    function disarmStart() {
      clearTimeout(armTimer);
      el.start.classList.remove("armed");
      el.start.textContent = "새 게임 시작";
    }

    el.start.addEventListener("click", () => {
      if (game.current > 0 && !el.start.classList.contains("armed")) {
        el.start.classList.add("armed");
        el.start.textContent = `${game.current}회 기록 지우고 시작`;
        armTimer = setTimeout(disarmStart, 3200);
        return;
      }
      disarmStart();
      startNewGame(true);
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea, [contenteditable]")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "ArrowUp" || e.key === "ArrowRight") { e.preventDefault(); move(1); }
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => fitText(el.score), 120);
    });

    // 상대 시간 갱신
    setInterval(() => {
      el.stampTime.textContent = relTime(lastSaved);
      if (el.logCard.dataset.open === "true") renderLog();
    }, 30000);

    /* ═════════════ 시작 ═════════════ */
    applySoundButton();
    loadLog();
    renderLog();
    recalculateValues();
    renderTiles();
    updateHero(false);
    syncAllFields();
    inspect(0);
    renderChart();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { fitText(el.score); renderChart(); });
    }

    loadGameFromSupabase();
  </script>
</body>
</html>
